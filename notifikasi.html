<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifikasi - XY Cinema</title><link rel="stylesheet" href="assets/style.css"></head>
<body hidden>
<header id="hd"></header>
<main class="wrap"><h1>Notifikasi</h1><p class="mu">Kabar terbaru dari admin.</p><div id="list"></div></main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/app.js"></script>
<script>
boot("notif").then(x=>{
  if(!x)return;
  const seen=ls.get(),l=[...x.db.notifications].sort((a,b)=>a.date<b.date?1:-1);
  $("#list").innerHTML=l.length?l.map(n=>`<div class="nt${seen.includes(n.id)?"":" n"}"><i></i><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>${new Date(n.date).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</small></div></div>`).join(""):'<p class="mu" style="padding-top:20px">Belum ada notifikasi.</p>';
  ls.set(l.map(n=>n.id));
  document.querySelector(".bdg")?.remove();
});
</script>
</body></html>
